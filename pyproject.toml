[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orangectl"
version = "0.1.0"
description = "Universal slot-based process manager for Orange Pi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "psutil>=5.9",
]

[project.scripts]
orangectl = "orangectl.main:app"

[tool.setuptools.packages.find]
include = ["orangectl*"]
